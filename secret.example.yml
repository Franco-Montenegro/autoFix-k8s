# Ejemplo del Secret de las bases de datos. NO se versiona con valores reales:
# scripts/deploy.sh lo crea a partir de la variable de entorno DB_PASSWORD.
# Equivale a:
#   kubectl create secret generic autofix-db --from-literal=username=autofix \
#     --from-literal=password=<DB_PASSWORD> --from-literal=root-password=<DB_PASSWORD>
apiVersion: v1
kind: Secret
metadata:
  name: autofix-db
type: Opaque
stringData:
  username: autofix
  password: cambiar
  root-password: cambiar
