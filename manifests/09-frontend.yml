# Frontend (Nginx). Al arrancar genera /config.js con API_URL (URL del Gateway por NodePort).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: francoone/autofix-frontend-eval2:1.0.0
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef: {name: frontend}
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          resources:
            requests: {memory: 32Mi, cpu: 50m}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
