# API Gateway: unico componente del backend expuesto fuera del cluster (NodePort 30080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: francoone/autofix-gateway:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: autofix-common}
            - configMapRef: {name: gateway}
          # Java arranca lento en la VM: hasta 5 min (60 x 5 s) antes de evaluar liveness
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 20
            failureThreshold: 3
          # El Service solo envia trafico al pod cuando esta listo
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 10
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
